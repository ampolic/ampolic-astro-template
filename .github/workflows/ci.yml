name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Hosted in the public ampolic/.github repo — public repos cannot call
    # reusable workflows that live in private repos (ampolic-core is private).
    # Deploys are direct-upload via wrangler: dev push -> preview (staging),
    # main push -> production. Cloudflare's git-build pipeline is unused.
    uses: ampolic/.github/.github/workflows/site-ci.yml@main
    with:
      node-version: '22'
      deploy-project: ampolic-astro-template
    secrets:
      packages-token: ${{ secrets.PACKAGES_TOKEN }}
      cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
